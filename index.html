<!DOCTYPE html>
<html lang="bn">
<head>

<meta name="description" content="মুদি দোকান, মোবাইল ব্যাংকিং ও রিচার্জ ব্যবসার সম্পূর্ণ ফ্রি হিসাব — স্টক, পাবো-দেবো খাতা, কমিশন ও লাভ-ক্ষতি রিপোর্ট">

<style>
:root{--g1:#00897b;--g2:#00564c;--grn:#2e7d32;--red:#c62828;--ink:#17302b;--mut:#6b827d;--bg:#eef4f2;--card:#fff;--line:#dce8e5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans Bengali','Hind Siliguri','SolaimanLipi',-apple-system,'Segoe UI',Roboto,sans-serif;background:#dfe9e7;color:var(--ink);font-size:15.5px;line-height:1.45}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 24px rgba(0,50,40,.15);position:relative}
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
header .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
header .tt{flex:1;min-width:0}
header .tt b{display:block;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tt small{opacity:.85;font-size:11.5px}
.stchip{font-size:10.5px;background:rgba(255,255,255,.16);border-radius:20px;padding:3px 8px;white-space:nowrap}
main{padding:12px 12px 96px}
.view{display:none}.view.on{display:block;animation:fade .18s}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:11px;box-shadow:0 1px 4px rgba(20,80,70,.07)}
.ch{font-weight:700;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ch .lnk{color:var(--g1);font-weight:700;font-size:13px;border:none;background:none;font-family:inherit;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:16px;color:#fff;padding:16px;margin-bottom:11px;box-shadow:0 4px 14px rgba(0,110,95,.25)}
.hero .hdate{font-size:12.5px;opacity:.9}
.hero .hshop{font-size:20px;font-weight:800;margin:2px 0 8px}
.hero .hcash{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.14);border-radius:10px;padding:8px 12px;font-size:13.5px}
.hero .hcash b{font-size:17px}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:11px}
.qbtn{background:var(--card);border:none;border-radius:13px;padding:10px 2px 8px;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 1px 4px rgba(20,80,70,.07);color:var(--ink);font-family:inherit;cursor:pointer}
.qbtn span{font-size:11.5px;font-weight:700}
.b3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.b3 small{display:block;color:var(--mut);font-size:11.5px}
.b3 b{display:block;font-size:15px;margin:2px 0}
.grn{color:var(--grn)}.red{color:var(--red)}.mut{color:var(--mut)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}
.chip{min-width:106px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:7px 10px;flex:none}
.chip small{display:block;color:var(--mut);font-size:11px;white-space:nowrap}
.chip b{font-size:14px;white-space:nowrap}
.lrow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid #e8f0ee}
.lrow:last-child{border-bottom:none}
.lrow .lt{flex:1;min-width:0}
.lrow small{color:var(--mut);font-size:11.8px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow b{font-size:14px}
.rt{text-align:right;flex:none}
.rt small{display:block}
.del{border:none;background:none;color:#b0bfc0;font-size:15px;padding:4px 6px;cursor:pointer}
nav#bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.nbtn{flex:1;border:none;background:none;font-family:inherit;font-size:10.8px;color:#7d938e;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-weight:700;cursor:pointer}
.nbtn i{font-size:19px;font-style:normal}
.nbtn.on{color:var(--g1)}
.fabw{flex:1;display:flex;justify-content:center;margin-top:-30px}
.fab{width:58px;height:58px;border-radius:50%;border:4px solid var(--bg);background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:28px;box-shadow:0 4px 12px rgba(0,120,105,.4);cursor:pointer}
.seg{display:flex;background:#e2edea;border-radius:11px;padding:3px;margin-bottom:11px}
.segb{flex:1;border:none;background:none;font-family:inherit;padding:8px 4px;border-radius:9px;font-weight:700;font-size:13px;color:#54706a;cursor:pointer;white-space:nowrap}
.segb.on{background:#fff;color:var(--g1);box-shadow:0 1px 4px rgba(0,0,0,.09)}
.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--g1)}
.lbl{font-size:12.5px;font-weight:700;color:#54706a;margin:9px 0 4px;display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{border:none;border-radius:11px;padding:11px 14px;font-family:inherit;font-size:14.5px;font-weight:700;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;width:100%;cursor:pointer}
.btn.sm{width:auto;padding:8px 12px;font-size:12.8px}
.btn.ghost{background:#e6efed;color:#31514b}
.btn.danger{background:linear-gradient(135deg,#e53935,#b71c1c)}
.btn.warn{background:#fff3e0;color:#b2600b}
.mback{position:fixed;inset:0;background:rgba(10,40,35,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.mcard{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line)}
.mtitle{font-weight:800;font-size:16px}
.xbtn{border:none;background:#eef4f2;border-radius:9px;width:30px;height:30px;font-size:14px;color:#54706a;cursor:pointer}
.mbody{padding:13px 15px;overflow-y:auto}
.mfoot{display:flex;gap:8px;padding:12px 15px;border-top:1px solid var(--line)}
#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#17302b;color:#fff;padding:9px 18px;border-radius:24px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;white-space:nowrap}
#toast.on{opacity:1}
.badge{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px}
.b-grn{background:#e6f4e8;color:var(--grn)}.b-red{background:#fdeaea;color:var(--red)}.b-org{background:#fff2df;color:#a05e08}.b-teal{background:#e0f2f0;color:var(--g1)}
.bar{height:9px;background:#e4eeeb;border-radius:6px;overflow:hidden;margin:3px 0 8px}
.barf{height:100%;background:linear-gradient(90deg,var(--g1),#26a69a);border-radius:6px}
.empty{text-align:center;color:var(--mut);padding:18px 6px;font-size:13.5px}
.menurow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #e8f0ee;cursor:pointer}
.menurow:last-child{border:none}
.menurow .mi{width:40px;height:40px;border-radius:11px;background:#e0f2f0;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.menurow b{font-size:14.5px;display:block}
.menurow small{color:var(--mut);font-size:11.8px}
.menurow .arw{margin-left:auto;color:#9db5af}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;color:var(--mut);font-size:11.2px;padding:4px 3px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:6px 3px;border-bottom:1px solid #edf4f2}
.tbl .r{text-align:right}
.alertcard{background:#fff8e6;border:1px solid #f2dc9b;border-radius:13px;padding:11px 13px;margin-bottom:11px;font-size:13.5px}
.lockback{position:fixed;inset:0;background:linear-gradient(160deg,#00897b,#003d36);z-index:120;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.prow{display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:8px;border:none;background:#e0f2f0;color:var(--g1);font-size:17px;font-weight:800;cursor:pointer}
.stepper b{min-width:22px;text-align:center}
h4.sec{margin:14px 0 8px;font-size:14.5px}
a.btn{text-decoration:none;display:block;text-align:center}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo">📒</div>
  <div class="tt"><b id="h_shop">আমার হিসাব</b><small>মুদি • মোবাইল ব্যাংকিং • রিচার্জ</small></div>
  <span class="stchip" id="h_store"></span>
</header>
<main>
  <section id="view-home" class="view on"></section>
  <section id="view-grocery" class="view"></section>
  <section id="view-mobile" class="view"></section>
  <section id="view-ledger" class="view"></section>
  <section id="view-report" class="view"></section>
  <section id="view-more" class="view"></section>
</main>
<nav id="bnav">
  <button class="nbtn on" data-t="home" onclick="go('home')"><i>🏠</i>হোম</button>
  <button class="nbtn" data-t="grocery" onclick="go('grocery')"><i>🛒</i>মুদি</button>
  <div class="fabw"><button class="fab" onclick="openQuickAdd()">＋</button></div>
  <button class="nbtn" data-t="ledger" onclick="go('ledger')"><i>📒</i>খাতা</button>
  <button class="nbtn" data-t="more" onclick="cur.more='menu';go('more')"><i>☰</i>আরও</button>
</nav>
</div>
<div id="modalRoot"></div>
<div id="lockRoot"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= স্টোরেজ (ফোনে সেভ + প্রিভিউ ফলব্যাক) ================= */
let canStore=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){canStore=false}
const LSKEY='amarHishab.v1';
function save(){if(canStore){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}}
function load(){if(!canStore)return null;try{const s=localStorage.getItem(LSKEY);return s?JSON.parse(s):null}catch(e){return null}}

/* ================= সাধারণ হেল্পার ================= */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const t2=v=>Math.round((+v||0)*100)/100;
const el=id=>document.getElementById(id);
const MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const bnf=new Intl.NumberFormat('bn-BD',{maximumFractionDigits:2});
const bn=n=>bnf.format(t2(n));
const fmt=n=>{n=+n||0;return (n<0?'−৳':'৳')+bnf.format(Math.abs(t2(n)))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayISO(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysAgoISO(n){const d=new Date();d.setDate(d.getDate()-n);return todayISO(d)}
function fmtDate(ds){if(!ds)return '';const p=String(ds).split('-');return bn(+p[2])+' '+(MONTHS[+p[1]-1]||'')+' '+bn(+p[0])}

/* ================= ডেটা মডেল ================= */
function freshState(){return{
  v:1,
  settings:{shopName:'আমার দোকান',ownerName:'',ownerPhone:'',openingCash:0,pin:'',passHash:'',passHint:'',driveClientID:'',lastDrive:'',autoRemind:true,remindOff:'',autoBackup:true,gTok:null,lastAutoFail:0,catalogV:0},
  parties:[],partyTxns:[],
  products:[],sales:[],purchases:[],expenses:[],
  wallets:[
    {key:'bkash',name:'বিকাশ',opening:0,ci:18,co:5,sf:5},
    {key:'nagad',name:'নগদ',opening:0,ci:15,co:10,sf:5},
    {key:'rocket',name:'রকেট',opening:0,ci:15,co:10,sf:5},
    {key:'upay',name:'উপায়',opening:0,ci:15,co:5,sf:5}
  ],
  walletTxns:[],
  operators:[
    {key:'gp',name:'গ্রামীণফোন',opening:0,rate:30},
    {key:'robi',name:'রবি',opening:0,rate:30},
    {key:'bl',name:'বাংলালিংক',opening:0,rate:30},
    {key:'tt',name:'টেলিটক',opening:0,rate:35}
  ],
  rechTxns:[]
}}
/* মোবাইল ব্যাংকিং লেনদেনের ধরন: wallet=ওয়ালেটে টাকা যায়(+)/কমে(−), cash=নগদে যায়/কমে */
const MFS_TYPES={
  cashin:{lbl:'ক্যাশ ইন (গ্রাহক নগদ দিবে)',w:-1,c:1,comm:'ci'},
  cashout:{lbl:'ক্যাশ আউট (গ্রাহক নগদ নিবে)',w:1,c:-1,comm:'co'},
  send:{lbl:'সেন্ড মানি',w:-1,c:1,fee:true},
  payment:{lbl:'পেমেন্ট (বিল/মার্চেন্ট)',w:-1,c:1},
  addmoney:{lbl:'অ্যাড মানি (নগদ → ওয়ালেট)',w:1,c:-1},
  withdraw:{lbl:'কমিশন/টাকা উত্তোলন (ওয়ালেট → নগদ)',w:-1,c:1},
  adjust:{lbl:'সমন্বয় (হাতে মিলিয়ে)',w:0,c:0}
};
const RECH_TYPES={rech:{lbl:'রিচার্জ'},top:{lbl:'টপ-আপ (ব্যালান্স নেওয়া)'},comm:{lbl:'কমিশন/টাকা উত্তোলন'},adjust:{lbl:'সমন্বয়'}};
const EX_CAT={grocery:'মুদি',mfs:'ব্যাংকিং',rech:'রিচার্জ',common:'সাধারণ'};

let S=load();
if(!S){S=freshState();if(!canStore){loadDemo(true)}save()}

/* ================= বর্তমান অবস্থা ================= */
const cur={tab:'home',gsub:'sale',msub:'bank',more:'menu',range:{preset:'today',from:todayISO(),to:todayISO()},cart:[]};

/* ================= ব্যালান্স হিসাব (সব লেনদেন থেকে স্বয়ংক্রিয়) ================= */
function wBal(key){const w=S.wallets.find(x=>x.key===key);let b=w?w.opening:0;S.walletTxns.forEach(t=>{if(t.wkey===key)b+=t.wD||0});return t2(b)}
function opBal(key){const o=S.operators.find(x=>x.key===key);let b=o?o.opening:0;S.rechTxns.forEach(t=>{if(t.op===key)b+=t.oD||0});return t2(b)}
function cashTotal(){let c=S.settings.openingCash||0;
  S.sales.forEach(s=>c+=(s.paid||0));
  S.purchases.forEach(p=>c-=(p.paid||0));
  S.expenses.forEach(e=>c-=e.amount||0);
  S.partyTxns.forEach(t=>c+=t.cash||0);
  S.walletTxns.forEach(t=>c+=t.cD||0);
  S.rechTxns.forEach(t=>c+=t.cD||0);
  return t2(c)}
function partyBal(id){let b=0;S.partyTxns.forEach(t=>{if(t.partyId===id)b+=(t.kind==='due'?t.amount:-(t.amount||0))});return t2(b)}
function partyName(id){const p=S.parties.find(x=>x.id===id);return p?p.name:''}
function totPaboDibo(){let po=0,db=0;S.parties.forEach(p=>{const b=partyBal(p.id);if(p.type==='cust'&&b>0)po+=b;if(p.type==='supp'&&b>0)db+=b});return{po:t2(po),db:t2(db)}}
function stockValue(){let v=0,sv=0,low=0;S.products.forEach(p=>{v+=p.stockQty*p.buyPrice;sv+=p.stockQty*p.sellPrice;
const conf=p.buyPrice>0||p.sellPrice>0;
if(conf&&p.stockQty<=p.lowQty)low++});return{buy:t2(v),sell:t2(sv),low:low}}

/* ================= রিপোর্টের হিসাব ================= */
function statsGrocery(from,to){let tot=0,cost=0,prof=0,cnt=0;
  S.sales.forEach(s=>{if(s.date>=from&&s.date<=to){tot+=s.total;cost+=s.cost;prof+=s.profit;cnt++}});
  const exp=S.expenses.filter(e=>e.cat==='grocery'&&e.date>=from&&e.date<=to).reduce((a,e)=>a+e.amount,0);
  return{tot:t2(tot),cost:t2(cost),prof:t2(prof),cnt:cnt,exp:t2(exp),net:t2(prof-exp)}}
function statsMfs(from,to){const per={};let comm=0,fee=0,vol=0,cnt=0;
  S.walletTxns.forEach(t=>{if(t.date<from||t.date>to)return;
    const w=S.wallets.find(x=>x.key===t.wkey);const nm=w?w.name:t.wkey;
    if(!per[t.wkey])per[t.wkey]={name:nm,cnt:0,vol:0,comm:0,fee:0};
    const p=per[t.wkey];
    if(t.type!=='adjust'){p.cnt++;p.vol+=t.amount;vol+=t.amount;cnt++}
    p.comm+=t.comm||0;p.fee+=t.fee||0;comm+=t.comm||0;fee+=t.fee||0});
  Object.keys(per).forEach(k=>{const p=per[k];p.vol=t2(p.vol);p.comm=t2(p.comm);p.fee=t2(p.fee);p.net=t2(p.comm-p.fee)});
  const exp=S.expenses.filter(e=>e.cat==='mfs'&&e.date>=from&&e.date<=to).reduce((a,e)=>a+e.amount,0);
  return{per:per,comm:t2(comm),fee:t2(fee),vol:t2(vol),cnt:cnt,exp:t2(exp),net:t2(comm-fee-exp)}}
function statsRech(from,to){const per={};let comm=0,vol=0,cnt=0;
  S.rechTxns.forEach(t=>{if(t.date<from||t.date>to)return;
    const o=S.operators.find(x=>x.key===t.op);const nm=o?o.name:t.op;
    if(!per[t.op])per[t.op]={name:nm,cnt:0,vol:0,comm:0};
    const p=per[t.op];
    if(t.type==='rech'){p.cnt++;p.vol+=t.amount;vol+=t.amount;cnt++}
    p.comm+=t.comm||0;comm+=t.comm||0});
  Object.keys(per).forEach(k=>{const p=per[k];p.vol=t2(p.vol);p.comm=t2(p.comm)});
  const exp=S.expenses.filter(e=>e.cat==='rech'&&e.date>=from&&e.date<=to).reduce((a,e)=>a+e.amount,0);
  return{per:per,comm:t2(comm),vol:t2(vol),cnt:cnt,exp:t2(exp),net:t2(comm-exp)}}

/* ================= তারিখের রেঞ্জ ================= */
function setRange(p){const d=new Date();let from=todayISO(),to=todayISO();
  if(p==='yesterday'){from=to=daysAgoISO(1)}
  else if(p==='week'){const dow=(d.getDay()+1)%7;from=daysAgoISO(dow)}
  else if(p==='month'){from=to.slice(0,8)+'01'}
  else if(p==='lmonth'){const first=new Date(d.getFullYear(),d.getMonth()-1,1);const last=new Date(d.getFullYear(),d.getMonth(),0);from=todayISO(first);to=todayISO(last)}
  else if(p==='year'){from=to.slice(0,5)+'01-01'}
  cur.range={preset:p,from:from,to:to};renderReport()}

el('sf_list').innerHTML=list.length?list.map(p=>'<div class="lrow"><div class="lt"><b>'+esc(p.name)+'</b><small>স্টক '+bn(p.stockQty)+' '+esc(p.unit)+' • বিক্রয় '+fmt(p.sellPrice)+'</small></div><button class="btn sm" onclick="addCart(\''+p.id+'\')">＋</button></div>').join(''):'<div class="empty">পণ্য পাওয়া যায়নি — আগে "স্টক" ট্যাবে পণ্য যোগ করুন</div>'}
function addCart(pid){const p=S.products.find(x=>x.id===pid);if(!p)return;const it=cur.cart.find(c=>c.pid===pid);if(it)it.qty++;else cur.cart.push({pid:pid,qty:1});renderCart()}
function chCart(pid,d){const it=cur.cart.find(c=>c.pid===pid);if(!it)return;it.qty+=d;if(it.qty<=0)cur.cart=cur.cart.filter(c=>c.pid!==pid);renderCart()}
function cartTotal(){let t=0,c=0;cur.cart.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);if(p){t+=p.sellPrice*i.qty;c+=p.buyPrice*i.qty}});return{t:t2(t),c:t2(c)}}
function renderCart(){const ct=cartTotal();const box=el('sf_cart');if(!box)return;
box.innerHTML=cur.cart.length?'<div class="card" style="background:#e9f5f2;padding:8px 12px;margin-bottom:0">'
+cur.cart.map(i=>{const p=S.products.find(x=>x.id===i.pid);if(!p)return '';return '<div class="lrow"><div class="lt"><b>'+esc(p.name)+'</b><small>'+fmt(p.sellPrice)+' × '+bn(i.qty)+' = '+fmt(p.sellPrice*i.qty)+'</small></div>'
+'<div class="stepper"><button onclick="chCart(\''+i.pid+'\',-1)">−</button><b>'+bn(i.qty)+'</b><button onclick="chCart(\''+i.pid+'\',1)">＋</button></div></div>'}).join('')
+'<div class="lrow"><div class="lt"><b>সর্বমোট</b></div><b>'+fmt(ct.t)+'</b></div><small class="grn">💰 সম্ভাব্য লাভ ≈ '+fmt(ct.t-ct.c)+'</small></div>':''}
function saveSale(){if(!cur.cart.length)return toast('অন্তত একটি পণ্য যোগ করুন');
const items=[];let total=0,cost=0;
for(const i of cur.cart){const p=S.products.find(x=>x.id===i.pid);if(!p)continue;
if(i.qty>p.stockQty)return toast(p.name+': স্টকে মাত্র '+bn(p.stockQty)+' '+p.unit+' আছে!');
items.push({pid:p.id,name:p.name,unit:p.unit,qty:i.qty,buy:p.buyPrice,sell:p.sellPrice});total+=p.sellPrice*i.qty;cost+=p.buyPrice*i.qty}
total=t2(total);cost=t2(cost);const date=el('sf_date').value||todayISO();
const paidRaw=el('sf_paid').value;const paid=paidRaw===''?total:t2(paidRaw);const due=t2(Math.max(0,total-paid));
const partyId=el('sf_party').value||'';const id=uid();
S.sales.push({id:id,ts:Date.now(),date:date,items:items,total:total,cost:cost,profit:t2(total-cost),paid:paid,due:due,partyId:partyId});
items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);if(p)p.stockQty=t2(p.stockQty-i.qty)});
if(partyId&&due>0)S.partyTxns.push({id:uid(),ts:Date.now(),date:date,partyId:partyId,kind:'due',amount:due,cash:0,note:'বাকি বিক্রয়',saleId:id});
save();closeModal();toast('বিক্রয় সম্পন্ন! লাভ: '+fmt(total-cost));renderView()}
function delSale(id){confirmBox('এই বিক্রয় মুছলে স্টক ফেরত যাবে ও সংশ্লিষ্ট বাকি খাতার এন্ট্রি মুছে যাবে। মুছে ফেলবেন?',()=>{
const s=S.sales.find(x=>x.id===id);if(s){s.items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);if(p)p.stockQty=t2(p.stockQty+i.qty)});
S.partyTxns=S.partyTxns.filter(t=>t.saleId!==id);S.sales=S.sales.filter(x=>x.id!==id);save();renderView();toast('মুছে ফেলা হয়েছে')}})}

function savePurchase(){const pid=el('pu_p').value;const p=S.products.find(x=>x.id===pid);
const q=+el('pu_qty').value||0,r=+el('pu_rate').value||0;
if(!p||q<=0)return toast('পণ্য ও পরিমাণ ঠিক করুন');

p.stockQty=t2(p.stockQty+q);if(r>0)p.buyPrice=t2(r);
S.purchases.push({id:id,ts:Date.now(),date:date,pid:pid,name:p.name,unit:p.unit,qty:q,unitCost:t2(r),total:total,paid:paid,due:due,partyId:sup});
if(sup&&due>0)S.partyTxns.push({id:uid(),ts:Date.now(),date:date,partyId:sup,kind:'due',amount:due,cash:0,note:'বাকি ক্রয়',purId:id});
save();closeModal();toast('ক্রয় সম্পন্ন ✅');renderView()}
function delPurchase(id){confirmBox('মুছলে স্টক থেকে পরিমাণটি কমে যাবে ও সংশ্লিষ্ট দেনা এন্ট্রি মুছে যাবে। মুছবেন?',()=>{
const u=S.purchases.find(x=>x.id===id);if(u){const p=S.products.find(x=>x.id===u.pid);if(p)p.stockQty=t2(p.stockQty-u.qty);
S.partyTxns=S.partyTxns.filter(t=>t.purId!==id);S.purchases=S.purchases.filter(x=>x.id!==id);save();renderView()}})}

function openWalletTxnModal(wkey){wkey=wkey||(S.wallets[0]&&S.wallets[0].key);if(!wkey)return;

+'<label class="lbl">কোন ওয়ালেট?</label><select class="inp" id="wt_w" onchange="autoMfs()">'+S.wallets.map(w=>'<option value="'+w.key+'"'+(w.key===wkey?' selected':'')+'>'+esc(w.name)+' — ব্যালান্স '+fmt(wBal(w.key))+'</option>').join('')+'</select>'
+'<label class="lbl">টাকার পরিমাণ ৳ *</label><input class="inp" id="wt_amt" type="number" inputmode="decimal" oninput="autoMfs()">'
+'<div class="row2"><div><label class="lbl">আমার কমিশন (অটো)</label><input class="inp" id="wt_comm" type="number" inputmode="decimal"></div>'
+'<div><label class="lbl">ফি/চার্জ (অটো)</label><input class="inp" id="wt_fee" type="number" inputmode="decimal"></div></div>'
+'<label class="lbl">গ্রাহকের নাম/মোবাইল (ঐচ্ছিক)</label><input class="inp" id="wt_cust">'
+'<label class="lbl">মন্তব্য (ঐচ্ছিক)</label><input class="inp" id="wt_note">'
+'<label class="lbl">তারিখ</label><input class="inp" id="wt_date" type="date" value="'+todayISO()+'">'
+'<small class="mut" style="display:block;margin-top:6px">💡 কমিশন হাজার প্রতি রেট অনুযায়ী নিজে থেকেই বসে যায় (সেটিংস থেকে রেট বদলান)। দরকার হলে হাতেও ঠিক করতে পারবেন।</small>',
'<button class="btn ghost" onclick="closeModal()">বাতিল</button><button class="btn" onclick="saveWtxn()">সংরক্ষণ করুন</button>');
autoMfs()}
function autoMfs(){const a=+el('wt_amt').value||0;const w=S.wallets.find(x=>x.key===el('wt_w').value);const ty=MFS_TYPES[el('wt_type').value];
if(!w||!ty)return;let c=0,f=0;if(ty.comm)c=a/1000*w[ty.comm];if(ty.fee)f=a/1000*w.sf;
if(el('wt_comm'))el('wt_comm').value=t2(c);if(el('wt_fee'))el('wt_fee').value=t2(f)}
function saveWtxn(){const type=el('wt_type').value;const a=+el('wt_amt').value||0;
if(a<=0&&type!=='adjust')return toast('টাকার পরিমাণ লিখুন');
const ty=MFS_TYPES[type];const comm=+el('wt_comm').value||0,fee=+el('wt_fee').value||0;
const amt=t2(a);let wD,cD;
if(type==='adjust'){wD=amt;cD=0}else{wD=t2(ty.w*amt+comm-fee);cD=t2(ty.c*amt)}
S.walletTxns.push({id:uid(),ts:Date.now(),date:el('wt_date').value||todayISO(),wkey:el('wt_w').value,type:type,amount:amt,comm:t2(comm),fee:t2(fee),cust:el('wt_cust').value,note:el('wt_note').value,wD:wD,cD:cD});
save();closeModal();toast('লেনদেন সংরক্ষিত ✅'+((t2(comm-fee))!==0?' • লাভ '+fmt(t2(comm-fee)):''));renderView()}
function delWtxn(id){confirmBox('এই লেনদেনটি মুছে ফেলবেন?',()=>{S.walletTxns=S.walletTxns.filter(t=>t.id!==id);save();renderView()})}
function openWAdjust(key){const w=S.wallets.find(x=>x.key===key);
openModal('⚖️ ব্যালান্স সমন্বয় — '+esc(w.name),
'<p class="mut" style="font-size:13px;margin-bottom:4px">অ্যাপের হিসাবে এখন <b>'+fmt(wBal(key))+'</b> দেখাচ্ছে। স্টেটমেন্ট মিলিয়ে আসল ব্যালান্স লিখুন — পার্থক্যটি সমন্বয় হিসেবে যোগ হবে (নগদে কোনো প্রভাব নেই)।</p>'
+'<label class="lbl">আসল ব্যালান্স ৳</label><input class="inp" id="adj_real" type="number" inputmode="decimal">',
'<button class="btn ghost" onclick="closeModal()">বাতিল</button><button class="btn" onclick="saveWAdjust(\''+key+'\')">ঠিক করুন</button>')}
function saveWAdjust(key){const real=+el('adj_real').value||0;const diff=t2(real-wBal(key));

function openStatement(id){const p=S.parties.find(x=>x.id===id);if(!p)return;const isC=p.type==='cust';
const txs=S.partyTxns.filter(t=>t.partyId===id).slice().sort((a,b)=>a.date===b.date?(a.ts||0)-(b.ts||0):(a.date<b.date?-1:1));
let run=0,td=0,tst=0;
const rows=txs.map(t=>{let desc='';
if(t.saleId){const s=S.sales.find(x=>x.id===t.saleId);if(s)desc='বাকি বিক্রয় ('+s.items.map(i=>i.name+' '+bn(i.qty)+' '+i.unit).join(', ')+')'}
if(!desc)desc=t.note||(t.kind==='due'?(isC?'বাকি দেওয়া হলো':'দেনা হলো'):(isC?'পাওনা পেলাম':'দেনা দিলাম'));
const due=t.kind==='due'?t.amount:0,set=t.kind==='settle'?t.amount:0;td+=due;tst+=set;run=t2(run+due-set);
return '<tr><td style="white-space:nowrap">'+fmtDate(t.date)+'</td><td>'+esc(desc)+'</td><td class="r">'+(due?fmt(due):'—')+'</td><td class="r">'+(set?fmt(set):'—')+'</td><td class="r"><b>'+fmt(run)+'</b></td></tr>'}).join('');
openModal('📄 খাতা স্টেটমেন্ট — '+esc(p.name),
'<div class="card" style="background:#e9f5f2;margin-bottom:10px"><div class="b3" style="text-align:left">'
+'<div><small>মোট বাকি হয়েছে</small><b class="red">'+fmt(td)+'</b></div>'
+'<div><small>মোট জমা/পরিশোধ</small><b class="grn">'+fmt(tst)+'</b></div>'
+'<div><small>এখন '+(isC?'পাবো':'দেবো')+'</small><b style="font-size:16px">'+fmt(partyBal(id))+'</b></div></div>'
+'<small class="mut">'+(isC?'🔵 গ্রাহক — আমি পাবো':'🔴 সাপ্লায়ার — আমি দেবো')+(p.phone?' • 📞 '+esc(p.phone):'')+'</small></div>'
+(txs.length?'<div style="overflow-x:auto"><table class="tbl"><tr><th>তারিখ</th><th>বিবরণ</th><th class="r">বাকি (+)</th><th class="r">জমা (−)</th><th class="r">চলমান হিসাব</th></tr>'+rows+'</table></div>'
:'<div class="empty">কোনো লেনদেন নেই</div>'),
'<button class="btn ghost" onclick="closeModal()">বন্ধ করুন</button><button class="btn" onclick="copyStatement(\''+id+'\')">📋 কপি / শেয়ার করুন</button>')}
function buildStatementText(id){const p=S.parties.find(x=>x.id===id);if(!p)return '';const isC=p.type==='cust';
const txs=S.partyTxns.filter(t=>t.partyId===id).slice().sort((a,b)=>a.date===b.date?(a.ts||0)-(b.ts||0):(a.date<b.date?-1:1));
const L=[S.settings.shopName+' — খাতা স্টেটমেন্ট','নাম: '+p.name+' ('+(isC?'গ্রাহক — আমি পাবো':'সাপ্লায়ার — আমি দেবো')+')'+(p.phone?' • '+p.phone:''),'--------------------------------'];
let run=0;
txs.forEach(t=>{run=t2(run+(t.kind==='due'?t.amount:-t.amount));
let desc=t.note||(t.kind==='due'?'বাকি':'জমা');
if(t.saleId){const s=S.sales.find(x=>x.id===t.saleId);if(s)desc='বাকি বিক্রয় ('+s.items.map(i=>i.name+' '+bn(i.qty)+' '+i.unit).join(', ')+')'}
L.push(fmtDate(t.date)+' | '+desc+' | '+(t.kind==='due'?'+':'−')+fmt(t.amount)+' | চলমান '+fmt(run))});
L.push('--------------------------------');
L.push('বর্তমানে মোট '+(isC?'পাবো':'দেবো')+': '+fmt(partyBal(id)));
return L.join('\n')}

/* --- গুগল ড্রাইভ API (ফ্রি, শুধু নিজের ফোল্ডারে নিজের ফাইল) --- */
const DRV_FILE='amar-hishab-backup.json';
function loadGsi(){return new Promise((res,rej)=>{
if(window.google&&window.google.accounts&&window.google.accounts.oauth2)return res();
const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';
s.onload=()=>res();s.onerror=()=>rej(new Error('ইন্টারনেট সংযোগ বা Google স্ক্রিপ্ট লোড হয়নি'));
document.head.appendChild(s)})}
function getDrvToken(interactive){
if(!S.settings.driveClientID)return Promise.reject(new Error('আগে সেটিংসে Client ID বসান'));
if(S.settings.gTok&&S.settings.gTok.tk&&Date.now()<S.settings.gTok.exp-60000)return Promise.resolve(S.settings.gTok.tk);
return loadGsi().then(()=>new Promise((res,rej)=>{try{
const tc=window.google.accounts.oauth2.initTokenClient({client_id:S.settings.driveClientID,
scope:'https://www.googleapis.com/auth/drive.file',
callback:t=>{if(t&&t.access_token){S.settings.gTok={tk:t.access_token,exp:Date.now()+((t.expires_in||3600)-120)*1000};save();res(t.access_token)}else rej(new Error('লগইন ব্যর্থ হয়েছে'))},
error_callback:e=>{rej(new Error(interactive?'লগইন ব্যর্থ হয়েছে':'স্বয়ংক্রিয় লগইন সম্ভব হয়নি'))}});
tc.requestAccessToken(interactive?{}:{prompt:'none'})}catch(e){rej(e)}}))}
function drvStatus(m){const d=el('drvStatus');if(d)d.textContent=m}
function uploadToDrive(tk,data){const q=encodeURIComponent("name = '"+DRV_FILE+"' and trashed = false");
return fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name,modifiedTime)',{headers:{Authorization:'Bearer '+tk}})
.then(r=>r.json()).then(j=>{
const fid=j.files&&j.files[0]&&j.files[0].id;
if(fid)return fetch('https://www.googleapis.com/upload/drive/v3/files/'+fid+'?uploadType=media',{method:'PATCH',headers:{Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:data});
const b='xxamarhishabxx';const meta={name:DRV_FILE,mimeType:'application/json'};
const body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+data+'\r\n--'+b+'--';
return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+tk,'Content-Type':'multipart/related; boundary='+b},body:body})})}
function driveBackup(){drvStatus('অপেক্ষা করুন... লগইন উইন্ডো আসতে পারে');
getDrvToken(true).then(tk=>uploadToDrive(tk,JSON.stringify(Object.assign({},S,{savedAt:new Date().toISOString()}))))
.then(r=>{if(r.ok){S.settings.lastDrive=new Date().toISOString();save();drvStatus('✅ ব্যাকআপ সফল! আপনার গুগল ড্রাইভে "'+DRV_FILE+'" নামে সেভ হয়েছে।');toast('ড্রাইভে ব্যাকআপ সফল ✅');if(cur.tab==='home')renderView()}else drvStatus('ব্যাকআপ ব্যর্থ (কোড '+r.status+') — গাইড দেখুন')})
.catch(e=>{drvStatus('❌ '+(e&&e.message?e.message:'ব্যর্থ হয়েছে'))})}
/* --- 🤖 স্বয়ংক্রিয় ব্যাকআপ: অ্যাপ খুললেই + খোলা থাকলে প্রতি ৩০ মিনিটে (১১+ ঘণ্টা পার হলে) --- */
let __autoBusy=false;
function hoursSinceBackup(){const l=S.settings.lastDrive;if(!l)return 999;try{return (Date.now()-new Date(l).getTime())/3600000}catch(e){return 999}}
function maybeAutoBackup(){
if(!canStore||!S.settings.driveClientID)return;
if(S.settings.autoBackup===false)return;
if(__autoBusy||hoursSinceBackup()<11)return;
__autoBusy=true;
getDrvToken(false)
.then(tk=>uploadToDrive(tk,JSON.stringify(Object.assign({},S,{savedAt:new Date().toISOString()}))))
.then(r=>{if(!r.ok)throw new Error('আপলোড ব্যর্থ ('+r.status+')');
S.settings.lastDrive=new Date().toISOString();save();
toast('☁️ স্বয়ংক্রিয় ব্যাকআপ সম্পন্ন ✅');if(cur.tab==='home')renderView()})
.catch(e=>{const now=Date.now();
if(now-(S.settings.lastAutoFail||0)>6*3600000){S.settings.lastAutoFail=now;save();
toast('☁️ স্বয়ংক্রিয় ব্যাকআপ সম্ভব হয়নি — "ড্রাইভে ব্যাকআপ" বাটনে একবার চাপ দিন')}})
.then(()=>{__autoBusy=false})}
function driveRestore(){drvStatus('অপেক্ষা করুন...');
getDrvToken(true).then(tk=>{const q=encodeURIComponent("name = '"+DRV_FILE+"' and trashed = false");
return fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name,modifiedTime)',{headers:{Authorization:'Bearer '+tk}})
.then(r=>r.json()).then(j=>{const f=j.files&&j.files[0];
if(!f)throw new Error('ড্রাইভে কোনো ব্যাকআপ ফাইল পাওয়া যায়নি');
return fetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',{headers:{Authorization:'Bearer '+tk}})})
.then(r=>r.json()).then(data=>{
if(!data||!data.settings)throw new Error('ফাইলটি সঠিক ব্যাকআপ নয়');
const when=data.savedAt?(' ('+fmtDate(String(data.savedAt).slice(0,10))+')'):'';
confirmBox('ড্রাইভের ব্যাকআপ'+when+' বসালে বর্তমান সব ডেটা মুছে যাবে। চালিয়ে যাবেন?',()=>{S=data;save();renderView();toast('রিস্টোর সম্পন্ন ✅')})})})
.catch(e=>{drvStatus('❌ '+(e&&e.message?e.message:'ব্যর্থ হয়েছে'))})}

function importCatalog(){
if(!S.settings.catalogV||S.settings.catalogV<CATALOG_VERSION){
let added=0;
CATALOG.forEach(function(n){const nm=String(n).trim();if(!nm)return;
let exists=false;for(let i=0;i<S.products.length;i++){if(S.products[i].name===nm){exists=true;break}}
if(!exists){S.products.push({id:uid(),name:nm,unit:CAT_UNITS[nm]||'পিস',buyPrice:0,sellPrice:0,stockQty:0,lowQty:5});added++}});
S.settings.catalogV=CATALOG_VERSION;save();
if(added>0&&canStore)setTimeout(function(){toast('📦 '+bn(added)+' টি পণ্য স্টক তালিকায় যোগ হয়েছে — দাম ও স্টক বসিয়ে নিন')},900)}}
